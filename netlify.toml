[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Runs every 5 minutes and publishes any "scheduled for later" book whose time has come —
# and, in the same run, also drains one book from the persistent publish queue if it's
# enabled and its configured interval has elapsed (see lib/publishQueue.js). Not called by
# the frontend — Netlify's own scheduler triggers this on its own.
[functions."scheduled-publish"]
  schedule = "*/5 * * * *"

# Runs every 10 minutes and refreshes Telegram view counts for a small batch of
# previously-published posts (see lib/telegramViews.js + functions/refresh-views.js).
# Not called by the frontend, and a no-op if no probe chat is configured.
[functions."refresh-views"]
  schedule = "*/10 * * * *"

# Runs every 6 hours and checks a batch of previously-published books' download links,
# alerting via ADMIN_CHAT_ID (see lib/adminAlert.js) the first time one is confirmed dead
# (see functions/check-dead-links.js for the "confirmed" logic — two consecutive failed
# checks, not just one, to avoid false alarms from a transient network blip).
[functions."check-dead-links"]
  schedule = "0 */6 * * *"

# Runs once a day and pushes the same data as the manual "Export Backup" button to a
# GitHub repo (see lib/githubBackup.js + functions/scheduled-backup.js). No-op if
# GITHUB_BACKUP_TOKEN/GITHUB_BACKUP_REPO aren't set.
[functions."scheduled-backup"]
  schedule = "0 3 * * *"

# Runs once a day and prunes old Netlify Blobs data (see cleanup.js for the retention
# windows) so storage stays well inside the free tier over time. Not called by the frontend.
[functions."cleanup"]
  schedule = "15 3 * * *"
